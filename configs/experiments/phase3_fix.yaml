# configs/experiments/phase3_fix.yaml — causal validation / the fix (stretch).
# Run the baselines you must BEAT first (augmentation, dropout), then the targeted fix.
defaults: base.yaml

experiment:
  name: phase3_fix
  phase: 3

baselines: [augmentation, dropout]   # must be beaten before the fix counts

fix:
  kind: null                          # consistency_loss | representation_align (set after Phase 2 locates the module)
